# The merenda.io plan-link and add-a-friend pages. Run in front of GitHub Pages for
# /plan/<token> and /add/ (the sender's name on the page and its card);
# everything else on the domain (the landing page, /privacy/, /add/, the AASA, the
# legacy /plan/?p=<uuid> bounce) still comes straight from the static site.
#
# Deploy:  npx wrangler login   (once, opens the browser)
#          npx wrangler deploy
# Needs the apex DNS records proxied (orange cloud) in Cloudflare with SSL/TLS set to
# Full (strict) — a route can only intercept traffic Cloudflare terminates.
name = "merenda-plan-link"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "merenda.io/plan/*", zone_name = "merenda.io" },
  { pattern = "www.merenda.io/plan/*", zone_name = "merenda.io" },
  { pattern = "merenda.io/add/*", zone_name = "merenda.io" },
  { pattern = "www.merenda.io/add/*", zone_name = "merenda.io" },
  { pattern = "merenda.io/boston", zone_name = "merenda.io" },
  { pattern = "www.merenda.io/boston", zone_name = "merenda.io" },
  { pattern = "merenda.io/photo/*", zone_name = "merenda.io" },
]

[vars]
# The anon key is public by design (it ships in the app); RLS + the token do the gating.
